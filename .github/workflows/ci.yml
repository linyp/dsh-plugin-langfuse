name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:e2e

  # Early warning against upstream churn: dsh is in developer preview with no
  # compatibility promise, so rehearse against the newest published versions.
  # The `latest` dist-tag trails the rc line, so the bump script resolves the
  # true newest from each package's versions list instead.
  upstream-canary:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node .github/scripts/bump-upstream.mjs
      - run: npm install
      - run: npm run typecheck
      - run: npm test
