name: Upstream compatibility canary

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Monday 10:17 Asia/Shanghai. A non-round minute avoids peak-hour queues.
    - cron: '17 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-canary-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  newest-deepseek-packages:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Keep routine branch feedback advisory. Scheduled/manual rehearsals are
    # strict so a red run cannot disappear behind continue-on-error.
    continue-on-error: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Resolve newest published @deepseek-ai packages
        run: node .github/scripts/bump-upstream.mjs
      - name: Install the resolved dependency graph
        run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:e2e
      - run: npm run test:package
      - name: Upload the failed resolution for reproduction
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: upstream-canary-resolution-${{ github.run_id }}
          path: |
            package.json
            package-lock.json
          if-no-files-found: ignore
          retention-days: 14
